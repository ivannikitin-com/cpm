name: cpm-dev

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cpm-nginx
    ports:
      - "8080:8080" # PHP 7.4 (старая CPM / импорт данных)
      - "8081:8081" # PHP 8.4 (новая CPM v3)
    volumes:
      - wp_data:/var/www/html:rw
      - ./source:/var/www/html/wp-content/plugins/cpm:ro
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./log/nginx:/var/log/nginx:rw
    depends_on:
      - php74
      - php84

  php74:
    build:
      context: .
      dockerfile: docker/php74/Dockerfile
    container_name: cpm-php74
    working_dir: /var/www/html
    volumes:
      - wp_data:/var/www/html:rw
      - ./www/wp-config.php:/var/www/html/wp-config.php:rw
      - ./source:/var/www/html/wp-content/plugins/cpm:rw
      - ./log/php74:/var/log/php:rw
      - ./log/wp-content/debug.log:/var/www/html/wp-content/debug.log:rw
    environment:
      DB_HOST: mysql
      DB_NAME: wordpress
      DB_USER: wordpress
      DB_PASSWORD: wordpress

  php84:
    build:
      context: .
      dockerfile: docker/php84/Dockerfile
    container_name: cpm-php84
    working_dir: /var/www/html
    volumes:
      - wp_data:/var/www/html:rw
      - ./www/wp-config.php:/var/www/html/wp-config.php:rw
      - ./source:/var/www/html/wp-content/plugins/cpm:rw
      - ./log/php84:/var/log/php:rw
      - ./log/wp-content/debug.log:/var/www/html/wp-content/debug.log:rw
    environment:
      DB_HOST: mysql
      DB_NAME: wordpress
      DB_USER: wordpress
      DB_PASSWORD: wordpress

  mysql:
    image: mysql:8.0
    container_name: cpm-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: cpm-mailhog
    ports:
      - "1025:1025" # SMTP-порт (принимает почту)
      - "8025:8025" # Web-интерфейс просмотра писем

volumes:
  wp_data:
  db_data:
